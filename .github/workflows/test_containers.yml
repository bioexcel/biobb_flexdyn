name: tests containers

on:
  # workflow_dispatch
  push:
    branches: [ master ]
    paths-ignore:
      - '.gitignore'
      - '.readthedocs.yaml'
      - 'LICENSE'
      - 'setup.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'references.jsonld'
      - '**/docs/**'
      - '**/json_schemas/**'
      - '.github/workflows/pr-tests.yml'
      - '**/test/data/**'
      - '**/test/references/**'
      - '.github/workflows/linting_and_testing.yml'

jobs:
  test_containers:
    uses: bioexcel/biobb/.github/workflows/test_containers.yml@master
    with:
      extra-packages: "prody sciPy>=1.13.0,<1.14.0"
      setup-script: |
        sed -i "s|path_to_concoord_lib|$GITHUB_WORKSPACE/biobb_flexdyn/flexdyn/lib|g" biobb_flexdyn/test/conf.yml
